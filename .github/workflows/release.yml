name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without leading v), e.g. 0.1.4"
        required: true

jobs:
  build-binaries:
    name: Build core binary (${{ matrix.arch }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            packages: musl-tools
            run_tests: true
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            packages: gcc-aarch64-linux-gnu
            run_tests: false
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}
          rustup target add ${{ matrix.target }}

      - name: Resolve version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set crate version from tag
        working-directory: rust
        run: sed -i "s/^version = .*/version = \"${{ env.VERSION }}\"/" Cargo.toml

      - name: Test
        if: matrix.run_tests
        working-directory: rust
        run: cargo test

      - name: Build (static musl)
        working-directory: rust
        run: cargo build --release --bin bopm-cli --target ${{ matrix.target }}

      - name: Package binary
        run: |
          mkdir release
          cp rust/target/${{ matrix.target }}/release/bopm-cli release/
          tar -czvf bopm-cli-v${{ env.VERSION }}-linux-${{ matrix.arch }}.tar.gz -C release .

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: bopm-cli-v${{ env.VERSION }}-linux-${{ matrix.arch }}.tar.gz

  publish-docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'release' }}
          build-args: |
            IMAGE_VERSION=${{ env.VERSION }}
            CORE_VERSION=${{ env.VERSION }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.VERSION }}
            ghcr.io/${{ github.repository }}:latest
